name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "SECURITY.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "SECURITY.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-proxy:
    name: Linux proxy and OpenSSL build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install proxy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev

      - name: Build Linux proxy
        run: |
          cmake -S tools/linux-proxy -B tools/linux-proxy/build
          cmake --build tools/linux-proxy/build -j "$(nproc)"

      - name: Verify portable proxy corpora
        run: |
          ./tools/linux-proxy/build/rsl-linux-proxy > "$RUNNER_TEMP/golden-proxy.txt"
          diff -u tools/linux-proxy/corpus/proxy-vectors.txt "$RUNNER_TEMP/golden-proxy.txt"

          out="$RUNNER_TEMP/storage-proxy"
          ./tools/linux-proxy/build/rsl-linux-proxy --storage "$out"
          diff -u tools/linux-proxy/corpus/storage/MANIFEST.json "$out/MANIFEST.json"

          set +e
          ./tools/linux-proxy/build/rsl-linux-proxy --verify-storage "$out"
          rc=$?
          set -e
          if [ "$rc" -ne 3 ]; then
            echo "::error::Expected proxy storage verifier rejection status 3; got $rc."
            exit 1
          fi

      - name: Require OpenSSL supplemental peer
        run: |
          set +e
          ./tools/linux-proxy/build/rsl-linux-proxy --tls-peer 0
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "::error::OpenSSL peer is unavailable; expected argument error 2, got $rc."
            exit 1
          fi

      - name: Publish Linux proxy
        uses: actions/upload-artifact@v4
        with:
          name: linux-proxy-${{ github.sha }}
          path: tools/linux-proxy/build/rsl-linux-proxy
          if-no-files-found: error
          retention-days: 3

  windows-authority:
    name: Windows authority (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: windows-2022-${{ matrix.configuration }}-cargo-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-2022-${{ matrix.configuration }}-cargo-${{ hashFiles('rust/Cargo.lock') }}-

      - name: Report supported native toolchain
        shell: pwsh
        run: |
          . .\ossbuild\ossbuild.ps1 -Platform x64
          msbuild -version -nologo
          cl 2>&1 | Select-Object -First 3
          Write-Host "Windows SDK: $env:WindowsSDKVersion"

      - name: Build native RSL
        shell: pwsh
        run: .\build.ps1 -Configuration ${{ matrix.configuration }} -Platform x64

      - name: Build Windows oracle
        id: oracle
        shell: pwsh
        run: |
          $oracle = @(
            & .\tools\windows-oracle\build.ps1 `
              -Configuration ${{ matrix.configuration }} `
              -Platform x64
          )
          if ($oracle.Count -ne 1 -or -not (Test-Path -PathType Leaf $oracle[0])) {
            throw "Oracle build did not return exactly one executable path: $oracle"
          }
          "path=$($oracle[0])" >> $env:GITHUB_OUTPUT

      - name: Build Rust workspace
        shell: pwsh
        run: |
          $release = "${{ matrix.configuration }}" -eq "Release"
          .\build-rust.ps1 -Release:$release

      - name: Run Windows Rust tests
        shell: pwsh
        env:
          RSL_AUTHORITATIVE_INTEROP: "1"
          RSL_WINDOWS_ORACLE: ${{ steps.oracle.outputs.path }}
        run: |
          Push-Location rust
          try {
            $arguments = @(
              "test", "--workspace", "--all-features", "--locked"
            )
            if ("${{ matrix.configuration }}" -eq "Release") {
              $arguments += "--release"
            }
            $arguments += @("--", "--test-threads=1")
            & cargo @arguments *>&1 |
              Tee-Object "$env:RUNNER_TEMP\windows-rust-${{ matrix.configuration }}.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Generate Release authority artifact
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          .\tools\windows-oracle\New-InteropArtifact.ps1 `
            -OraclePath "${{ steps.oracle.outputs.path }}" `
            -OutputDirectory "$env:RUNNER_TEMP\rsl-authority" `
            -Configuration Release
          python .\tools\windows-oracle\validate_artifact.py `
            "$env:RUNNER_TEMP\rsl-authority" `
            --expected-revision "${{ github.sha }}" `
            --expected-configuration Release

      - name: Publish Release authority artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-authority-${{ github.sha }}
          path: ${{ runner.temp }}/rsl-authority
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-${{ matrix.configuration }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/windows-rust-${{ matrix.configuration }}.log
            ${{ runner.temp }}/rsl-authority/logs
          if-no-files-found: warn
          retention-days: 7

  linux-rust:
    name: Linux Rust and authoritative corpora
    runs-on: ubuntu-latest
    needs: [windows-authority, linux-proxy]
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows authority
        uses: actions/download-artifact@v4
        with:
          name: windows-authority-${{ github.sha }}
          path: ${{ runner.temp }}/rsl-authority

      - name: Download Linux proxy
        uses: actions/download-artifact@v4
        with:
          name: linux-proxy-${{ github.sha }}
          path: ${{ runner.temp }}/linux-proxy

      - name: Validate and configure downloaded artifacts
        run: |
          python tools/windows-oracle/validate_artifact.py \
            "$RUNNER_TEMP/rsl-authority" \
            --expected-revision "${{ github.sha }}" \
            --expected-configuration Release
          chmod +x "$RUNNER_TEMP/linux-proxy/rsl-linux-proxy"
          {
            echo "RSL_WINDOWS_WIRE=$RUNNER_TEMP/rsl-authority/wire/wire.txt"
            echo "RSL_WINDOWS_STORAGE=$RUNNER_TEMP/rsl-authority/storage"
            echo "RSL_LINUX_PROXY=$RUNNER_TEMP/linux-proxy/rsl-linux-proxy"
          } >> "$GITHUB_ENV"

      - name: Prepare supplemental proxy storage corpus
        run: |
          proxy_storage="$RUNNER_TEMP/storage-proxy-rust"
          "$RUNNER_TEMP/linux-proxy/rsl-linux-proxy" --storage "$proxy_storage"
          echo "RSL_STORAGE_CORPUS=$proxy_storage" >> "$GITHUB_ENV"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ubuntu-cargo-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ubuntu-cargo-${{ hashFiles('rust/Cargo.lock') }}-

      - name: Format, lint, and build
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --all-features --locked

      - name: Consume authoritative Windows corpora
        working-directory: rust
        run: |
          cargo test -p rsl-wire --test windows_oracle \
            committed_production_windows_wire_artifacts_parse_and_verify \
            --all-features --locked
          cargo test -p rsl-storage --test windows_oracle \
            production_windows_storage_artifacts_match_rust \
            --all-features --locked

      - name: Run portable Rust and proxy tests
        working-directory: rust
        run: cargo test --workspace --all-features --locked

      - name: Fuzz smoke
        working-directory: rust
        run: |
          fuzz_manifests="$(git ls-files '**/fuzz/Cargo.toml')"
          if [ -z "$fuzz_manifests" ]; then
            echo "No fuzz crate found."
            exit 0
          fi
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          for manifest in $fuzz_manifests; do
            crate="$(dirname "$(dirname "$manifest")")"
            crate="${crate#rust/}"
            echo "::group::Fuzzing $crate"
            (
              cd "$crate"
              for target in $(cargo +nightly fuzz list); do
                cargo +nightly fuzz run "$target" -- \
                  -max_total_time=30 -print_final_stats=1
              done
            )
            echo "::endgroup::"
          done
