name: CI

# Generic CI for the repo. Jobs are language/component-scoped and self-activate:
# add a new component (e.g. a Rust crate) and its job starts running without
# having to rewire triggers. Each job that can be a no-op guards itself so it
# skips cleanly when its inputs aren't present yet.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Portable C++ proxy tools built with CMake (currently tools/golden-gen).
  # Discovers every tools/*/CMakeLists.txt, so new CMake tools are picked up
  # automatically. The golden-gen tool additionally has a corpus to verify.
  # ---------------------------------------------------------------------------
  cmake-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # libssl-dev is optional for golden-gen (it enables the Phase-4d
        # `--tls-peer` interop oracle) but the build should exercise it.
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev

      - name: Build every CMake tool under tools/
        run: |
          shopt -s nullglob
          found=0
          for cml in tools/*/CMakeLists.txt; do
            found=1
            dir="$(dirname "$cml")"
            echo "::group::Building $dir"
            cmake -S "$dir" -B "$dir/build"
            cmake --build "$dir/build" -j "$(nproc)"
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            echo "No tools/*/CMakeLists.txt found; nothing to build."
          fi

      - name: Verify golden-gen corpus is reproduced byte-for-byte
        if: hashFiles('tools/golden-gen/build/golden-gen') != ''
        run: |
          # Running the generator also executes its built-in round-trip
          # self-check (non-zero exit on failure).
          ./tools/golden-gen/build/golden-gen > /tmp/golden-ci.txt
          if ! diff -u tools/golden-gen/corpus/phase1-golden.txt /tmp/golden-ci.txt; then
            echo "::error::Generated golden vectors differ from the committed corpus."
            echo "If this change intentionally alters the wire format, regenerate with:"
            echo "  ./tools/golden-gen/build/golden-gen > tools/golden-gen/corpus/phase1-golden.txt"
            exit 1
          fi
          echo "Corpus reproduced byte-for-byte."

      - name: Verify golden-gen storage corpus (Phase 3a)
        if: hashFiles('tools/golden-gen/build/golden-gen') != ''
        run: |
          out=/tmp/storage-ci
          rm -rf "$out"
          # Regenerate the whole storage corpus (logs, checkpoints, defunct.txt
          # + MANIFEST). The generator runs the extracted C++ readers over every
          # file it writes to fill in the MANIFEST outcomes.
          ./tools/golden-gen/build/golden-gen --storage "$out"

          # These are proxy files generated by the extracted Linux storage port,
          # not literal production Windows files. They are not
          # committed (see tools/golden-gen/.gitignore). MANIFEST.json IS
          # committed and records an fp64 -- Rabin-64 of the whole file -- for
          # every sample, alongside the executed recovery outcome. Those hashes
          # are computed from the files just regenerated above, so diffing the
          # MANIFEST byte-for-byte proves every regenerated file is byte-identical
          # to what was recorded, without checking binaries into the repo.
          if ! diff -u tools/golden-gen/corpus/storage/MANIFEST.json "$out/MANIFEST.json"; then
            echo "::error::Storage corpus differs from the committed MANIFEST."
            echo "If this change intentionally alters the storage format, regenerate with:"
            echo "  ./tools/golden-gen/build/golden-gen --storage tools/golden-gen/corpus/storage"
            exit 1
          fi

          # Proxy reverse-interop sanity. The generated corpus intentionally
          # contains rejected negative vectors, so the verifier must report its
          # dedicated rejection status rather than success.
          set +e
          ./tools/golden-gen/build/golden-gen --verify-storage "$out"
          rc=$?
          set -e
          if [ "$rc" -ne 3 ]; then
            echo "::error::Expected --verify-storage to exit 3 for rejected vectors; got $rc."
            exit 1
          fi
          echo "Storage corpus reproduced byte-for-byte (via MANIFEST fp64)."

  # ---------------------------------------------------------------------------
  # Authoritative Windows production oracle and mixed C++/Rust wire/storage tests.
  # ---------------------------------------------------------------------------
  windows-oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build production Windows oracle
        shell: pwsh
        run: |
          $oracle = & .\tools\windows-oracle\build.ps1 -Configuration Release
          "RSL_WINDOWS_ORACLE=$oracle" >> $env:GITHUB_ENV
          "RSL_AUTHORITATIVE_INTEROP=1" >> $env:GITHUB_ENV

      - name: Generate production artifacts
        shell: pwsh
        run: |
          $wireDir = Join-Path $env:RUNNER_TEMP "rsl-windows-wire"
          New-Item -ItemType Directory -Force $wireDir | Out-Null
          $wire = Join-Path $wireDir "wire.txt"
          $storage = Join-Path $env:RUNNER_TEMP "storage"
          & $env:RSL_WINDOWS_ORACLE --wire $wire
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:RSL_WINDOWS_ORACLE --storage $storage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RSL_WINDOWS_WIRE_DIR=$wireDir" >> $env:GITHUB_ENV
          "RSL_WINDOWS_STORAGE=$storage" >> $env:GITHUB_ENV

      - name: Test production Windows interop
        working-directory: rust
        shell: pwsh
        run: |
          cargo test -p rsl-wire --test windows_oracle --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p rsl-storage --test windows_oracle --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p rsl-net --test windows_network_oracle --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p rsl-net --test windows_learn_oracle --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p rsl-net --test schannel_interop --all-features -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: rsl-windows-oracle-${{ github.sha }}
          path: |
            ${{ env.RSL_WINDOWS_WIRE_DIR }}
            ${{ env.RSL_WINDOWS_STORAGE }}

  # ---------------------------------------------------------------------------
  # Rust — activates automatically once any Cargo.toml is added (e.g. the
  # pure-Rust port). Skips entirely while the repo has no Rust yet.
  # ---------------------------------------------------------------------------
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hashFiles() is not allowed in a job-level `if:`, so detect Rust here and
      # gate every downstream step on the result. The job spins up but no-ops
      # cheaply until any Cargo.toml is added (e.g. the pure-Rust port).
      - name: Detect Rust sources
        id: detect
        run: |
          # First Cargo.toml wins (root sorts before nested); its directory is
          # where cargo runs. Handles the workspace living under rust/ without
          # hardcoding the path.
          manifest="$(git ls-files 'Cargo.toml' '**/Cargo.toml' | head -1)"
          if [ -n "$manifest" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            echo "dir=$(dirname "$manifest")" >> "$GITHUB_OUTPUT"
            echo "Rust workspace at: $(dirname "$manifest")"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml found; skipping Rust build/test."
          fi

      - name: Set up Rust toolchain
        if: steps.detect.outputs.has_rust == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      - name: Format check
        if: steps.detect.outputs.has_rust == 'true'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.detect.outputs.has_rust == 'true'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        if: steps.detect.outputs.has_rust == 'true'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: cargo build --all-targets --all-features

      # The Linux extracted proxy remains useful for portable storage and network
      # coverage. Authority comes from the separate Windows job.
      - name: Build golden-gen proxy for storage + net interop
        if: steps.detect.outputs.has_rust == 'true'
        id: interop
        run: |
          if [ ! -f tools/golden-gen/CMakeLists.txt ]; then
            echo "No golden-gen proxy; portable proxy tests will self-skip."
            exit 0
          fi
          # libssl-dev enables `--tls-peer`; without it the TLS interop tests
          # skip themselves rather than fail.
          sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
          cmake -S tools/golden-gen -B tools/golden-gen/build
          cmake --build tools/golden-gen/build -j "$(nproc)"
          out=/tmp/storage-corpus-rust
          rm -rf "$out"
          ./tools/golden-gen/build/golden-gen --storage "$out"
          {
            echo "RSL_GOLDEN_GEN=$PWD/tools/golden-gen/build/golden-gen"
            echo "RSL_STORAGE_CORPUS=$out"
          } >> "$GITHUB_ENV"

      - name: Test
        if: steps.detect.outputs.has_rust == 'true'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: cargo test --all-features

      # Bounded coverage-guided fuzz smoke: ~30 s per target from an empty
      # corpus so CI stays fast (the generated corpora are not checked in; long
      # sessions run out-of-band, and the always-on stable-toolchain floor is
      # each crate's tests/fuzz_smoke.rs above). Every fuzz crate in the
      # workspace and every target it declares is run, so adding one needs no CI
      # change.
      - name: Fuzz smoke (bounded)
        if: steps.detect.outputs.has_rust == 'true'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          fuzz_manifests="$(git ls-files '**/fuzz/Cargo.toml')"
          if [ -z "$fuzz_manifests" ]; then
            echo "No fuzz crate found; skipping fuzz smoke."
            exit 0
          fi
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          for manifest in $fuzz_manifests; do
            # git ls-files ran in the workspace dir, so paths are relative to it.
            crate="$(dirname "$(dirname "$manifest")")"
            echo "::group::Fuzzing $crate"
            (
              cd "$crate"
              for target in $(cargo +nightly fuzz list); do
                echo "--- $target"
                cargo +nightly fuzz run "$target" -- -max_total_time=30 -print_final_stats=1
              done
            )
            echo "::endgroup::"
          done
