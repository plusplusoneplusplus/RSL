name: golden-gen

# Builds and runs the Phase-1 golden-vector generator (tools/golden-gen), which
# compiles the minimal slice of the original RSL C++ (marshaling + Rabin-64 +
# all message types) on Linux. Running it also executes the built-in round-trip
# self-check, and we verify the committed corpus still reproduces byte-for-byte.

on:
  push:
    paths:
      - 'tools/golden-gen/**'
      - 'src/common/src/**'
      - 'src/RSL/src/message.*'
      - 'src/inc/rsl.h'
      - '.github/workflows/golden-gen.yml'
  pull_request:
    paths:
      - 'tools/golden-gen/**'
      - 'src/common/src/**'
      - 'src/RSL/src/message.*'
      - 'src/inc/rsl.h'
      - '.github/workflows/golden-gen.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -S tools/golden-gen -B tools/golden-gen/build

      - name: Build
        run: cmake --build tools/golden-gen/build -j "$(nproc)"

      - name: Generate corpus (runs the 122/122 round-trip self-check)
        run: ./tools/golden-gen/build/golden-gen > /tmp/golden-ci.txt

      - name: Verify committed corpus is reproduced byte-for-byte
        run: |
          if ! diff -u tools/golden-gen/corpus/phase1-golden.txt /tmp/golden-ci.txt; then
            echo "::error::Generated golden vectors differ from the committed corpus."
            echo "If this change intentionally alters the wire format, regenerate with:"
            echo "  ./tools/golden-gen/build/golden-gen > tools/golden-gen/corpus/phase1-golden.txt"
            exit 1
          fi
          echo "Corpus reproduced byte-for-byte."
