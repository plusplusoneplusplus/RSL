[package]
name = "rsl-wire"
version = "0.1.0"
description = "Rust implementation of the RSL Paxos wire format."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Zero runtime dependencies. The wire kernel is pure Rust, no I/O, no unsafe.

[dev-dependencies]
# Test-only: the FIELDS-based independent-construction harness parses a small
# JSON blob per corpus record. These never ship in the library.
serde_json = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "wire"
harness = false

[lints.rust]
unsafe_code = "forbid"
