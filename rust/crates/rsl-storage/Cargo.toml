[package]
name = "rsl-storage"
version = "0.1.0"
description = "Rust implementation of the RSL on-disk storage formats."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rsl-wire = { path = "../rsl-wire" }

# `SeqReader` opens with O_DIRECT on Linux; Windows uses FILE_FLAG_NO_BUFFERING,
# whose value std already exposes through OpenOptionsExt::custom_flags.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Test-only: the storage corpus MANIFEST is JSON.
serde_json = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false }

[[bin]]
name = "seqio_bench"
path = "src/seqio_bench.rs"

[[bench]]
name = "checkpoint"
harness = false

[[bench]]
name = "readpath"
harness = false

[[bench]]
name = "writepath"
harness = false

[[bench]]
name = "log"
harness = false

[lints.rust]
unsafe_code = "forbid"
