[package]
name = "rsl-storage"
version = "0.1.0"
description = "Rust implementation of the RSL on-disk storage formats."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rsl-wire = { path = "../rsl-wire" }

[dev-dependencies]
# Test-only: the storage corpus MANIFEST is JSON.
serde_json = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "checkpoint"
harness = false

[[bench]]
name = "log"
harness = false

[lints.rust]
unsafe_code = "forbid"
