[package]
name = "rsl-net"
version = "0.1.0"
description = "Byte-exact Rust port of the RSL network framing (20-byte packet header + learn-port message framing)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The framing kernel is runtime-free by construction. `svc` adds the tokio
# transport (Phase 4b) on top; turn it off with `default-features = false` to
# depend on the bytes alone. `learnport` (Phase 4c) additionally pulls in
# `rsl-storage`, because state transfer *is* file transfer.
default = ["svc", "learnport"]
svc = ["dep:tokio"]
learnport = ["svc", "dep:rsl-storage", "tokio/fs"]

[dependencies]
rsl-wire = { path = "../rsl-wire" }
rsl-storage = { path = "../rsl-storage", optional = true }
tokio = { version = "1", optional = true, features = [
    "rt",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }
tokio = { version = "1", features = ["full", "test-util"] }

[[bench]]
name = "framing"
harness = false

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "learnport"
harness = false

[lints.rust]
unsafe_code = "forbid"
